name: Trialum Builder runner capability probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner boot check
        run: |
          echo 'Trialum Builder GitHub Actions is accessible'
          python3 --version
          node --version
