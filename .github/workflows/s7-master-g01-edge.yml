name: S7 MASTER genuine G01 smooth circular GLB finish
on:
  push:
    branches: ['feature/s7-master-garden-visual-rebuild-20261119']
    paths:
      - 'tools/b1/build-s7-master-g01-finish.py'
      - '.github/workflows/s7-master-g01-edge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s7-master-g01-edge
  cancel-in-progress: false
jobs:
  rebuild-smooth-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic 192-segment real GLB; preserve original shell and aquatic water
        run: |
          python3 -m py_compile tools/b1/build-s7-master-g01-finish.py
          python3 tools/b1/build-s7-master-g01-finish.py
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p=Path('assets/models/s7-master-g01-edge-finish.glb')
          raw=p.read_bytes()
          assert raw[:4]==b'glTF'
          assert struct.unpack_from('<I',raw,8)[0]==len(raw)
          n=struct.unpack_from('<I',raw,12)[0]
          gltf=json.loads(raw[20:20+n])
          assert gltf['asset']['version']=='2.0'
          assert len(gltf['meshes'][0]['primitives'])==4
          j=json.loads(Path('projects/trialum-s7-master-garden-review.json').read_text())
          assert any(x['assetId']=='s7-master-g01-edge-finish' for x in j['instances'])
          assert j['meta']['gameplayWrites']==0
          c=json.loads(Path('assets/catalog.json').read_text())
          assert c['genuineGlbCount']==361
          print('PASS original G01 aqua + circular finish physically exist')
          PY
      - name: Commit ONLY Builder review asset and scene, no Trialum game writes
        run: |
          set -euo pipefail
          git config user.name 'trialum-s7-master-visual-bot'
          git config user.email 's7-master-visual@users.noreply.github.com'
          git add -f assets/models/s7-master-g01-edge-finish.glb
          git add assets/catalog.json assets/s7-master-g01-edge-manifest.json projects/trialum-s7-master-garden-review.json
          if git diff --staged --quiet; then echo "Finish unchanged"; exit 0; fi
          git commit -m 'assets(S7 MASTER): real smooth edge finish GLB for G01 open-water center'
          git fetch origin feature/s7-master-garden-visual-rebuild-20261119
          git rebase origin/feature/s7-master-garden-visual-rebuild-20261119
          git push origin HEAD:feature/s7-master-garden-visual-rebuild-20261119
