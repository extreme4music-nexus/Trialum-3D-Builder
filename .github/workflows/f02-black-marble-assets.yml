name: F02 black marble — decode owner-render atlas and deliver 29 genuine GLBs
on:
  push:
    branches: [main]
    paths:
      - 'assets/source/f02-render-approved-kit.tar.zlib.b64'
      - '.github/workflows/f02-black-marble-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f02-builder-owner-render-physical-assets
  cancel-in-progress: false
jobs:
  f02-physical-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout private Builder main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Recover exact readable generator and source-derived mineral atlas from reviewed bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,tarfile,zlib
          from pathlib import Path
          src=Path("assets/source/f02-render-approved-kit.tar.zlib.b64")
          encoded=src.read_text().strip()
          assert len(encoded)==17232
          assert hashlib.sha256(encoded.encode()).hexdigest()=="5bd37fd1fcaa31f3419d927453e9b4c0094de6ec255d1f90d3c4b26c19e3dd64"
          payload=zlib.decompress(base64.b64decode(encoded))
          allowed={
           "tools/b1/build-s7-f02-black-marble.py":"21d0599e112fdc9503f8aec36f4cc54c7c6b408a981c1aab7745ee0ec9c40309",
           "assets/materials/f02-black-marble-approved-render-atlas.b64":"23c3a0d45f0386737a2dad22896b5667e2105c5d0fededd90f16a03b56849904"}
          with tarfile.open(fileobj=io.BytesIO(payload),mode="r") as tar:
           files={m.name:m for m in tar.getmembers()}
           assert set(files)==set(allowed),"Unexpected bundled source paths"
           for name,expected in allowed.items():
            raw=tar.extractfile(files[name]).read()
            assert hashlib.sha256(raw.rstrip(b"\n")).hexdigest()==expected,(name,"SOURCE_SHA_DRIFT")
            out=Path(name);out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(raw)
            print("RESTORED",name,len(raw))
          PY
      - name: Build and verify 29 actual standalone premium black marble GLBs from approved render
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/b1/build-s7-f02-black-marble.py > /tmp/f02-build-report.json
          python3 - <<'PY'
          import json,struct,hashlib
          from pathlib import Path
          folder=Path("build/s7-floor-f02");m=json.loads((folder/"qa-manifest.json").read_text())
          assert len(m["models"])==29
          assert m["atlasSha256"]=="77455ccf430ed93b34560611dfb632ba7dcc4d6c222a6f63a6cc8acc4e0e23ca"
          for asset in m["models"]:
           raw=(folder/asset["file"]).read_bytes()
           assert raw[:4]==b"glTF" and struct.unpack_from("<II",raw,4)==(2,len(raw))
           assert hashlib.sha256(raw).hexdigest()==asset["sha256"]
           assert asset["triangles"]>0
          print("PASS 29 genuine solid GLB files with reference-derived embedded texture.")
          PY
          mkdir -p assets/models
          cp build/s7-floor-f02/*.glb assets/models/
          mkdir -p assets/materials
          cp build/s7-floor-f02/f02-black-marble-exact-reference-atlas.png assets/materials/
          cp build/s7-floor-f02/qa-manifest.json assets/materials/f02-glb-sha-manifest.json
      - name: Git-commit real binaries plus human-readable source, never force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trialum-f02-builder-bot"
          git config user.email "trialum-f02-bot@users.noreply.github.com"
          git add tools/b1/build-s7-f02-black-marble.py assets/materials/f02-black-marble-approved-render-atlas.b64
          git add assets/materials/f02-black-marble-exact-reference-atlas.png assets/materials/f02-glb-sha-manifest.json
          git add assets/models/f02-black-marble-*.glb
          if git diff --cached --quiet; then
            echo "All 29 F02 files already present in exact reproducible form."
          else
            git commit -m "build(builder F02): ship 29 genuine render-reference black marble GLBs + original source"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "Owner model QA in Windows Builder still pending; no gameplay/Play modifications."
