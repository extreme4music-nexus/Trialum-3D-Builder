name: F02 owner-approved black marble — reproducible 29 real GLBs
on:
  push:
    branches: [main]
    paths:
      - 'tools/b1/build-s7-f02-black-marble.py'
      - 'assets/materials/f02-black-marble-approved-render-atlas.b64'
      - '.github/workflows/f02-black-marble-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: builder-f02-black-marble-binary-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Builder main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Build 29 actual original-geometry F02 black marble GLBs with owner-approved veins
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/b1/build-s7-f02-black-marble.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          p=Path("build/s7-floor-f02")
          m=json.loads((p/"qa-manifest.json").read_text())
          assert len(m["models"])==29, len(m["models"])
          for x in m["models"]:
            raw=(p/x["file"]).read_bytes()
            assert raw[:4]==b"glTF" and struct.unpack_from("<II",raw,4)==(2,len(raw)),x["file"]
            assert hashlib.sha256(raw).hexdigest()==x["sha256"]
            assert x["triangles"]>0
          print("PASS: 29 actual glTF2 mesh binaries, shared embedded reference atlas")
          PY
          mkdir -p assets/models
          cp build/s7-floor-f02/*.glb assets/models/
          cp build/s7-floor-f02/f02-black-marble-exact-reference-atlas.png assets/materials/
          cp build/s7-floor-f02/qa-manifest.json assets/materials/f02-glb-sha-manifest.json
      - name: Commit real new models; never force-push or edit user's projects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trialum-f02-builder-bot"
          git config user.email "trialum-f02-bot@users.noreply.github.com"
          git add assets/models/f02-black-marble-*.glb
          git add assets/materials/f02-black-marble-exact-reference-atlas.png assets/materials/f02-glb-sha-manifest.json
          if git diff --cached --quiet; then
            echo "All F02 models already present with identical bytes."
          else
            git commit -m "build(builder F02): commit 29 real owner-render-derived black marble GLBs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
